---
- name: Dump facts
  hosts: satellite.example.com
  connection: smart
  gather_facts: true
  become: true
  vars_files:
    - extra_vars.yml
    - sat_repos.yml

  environment:
    SATELLITE_SERVER_URL: "{{ satellite_server_url }}"
    SATELLITE_USERNAME: "{{ satellite_username }}"
    SATELLITE_PASSWORD: "{{ satellite_password }}"

  tasks:
    - name: "Show all organizations with 'name ~ Default'"
      redhat.satellite.organization_info:
        server_url: "https://satellite.example.com"
        search: "name ~ Default"
      register: orgs

    - name: Get all existing activation keys for organization ACME
      redhat.satellite.resource_info:
        server_url: "https://satellite.example.com"
        resource: activation_keys
        organization: "Default Organization"
      register: result
                   
    - name: Dump facts
      ansible.builtin.debug:
        var: result

    - name: Store in file
      ansible.builtin.copy:
        dest: "satellite_activation_keys.yml"
        content: "{{ activation_key_result | to_nice_yaml }}"
      when: result.resources | length > 0
      delegate_to: localhost  
      vars:
        activation_key_result:
          activation_keys: "{{ result.resources }}"
