- name: Satellite server pre-install preparations
  hosts: satellite
  become: true
  become_method: ansible.builtin.sudo
  environment:
    LANG: en_US.UTF-8
    LC_ALL: en_US.UTF-8
    TERM: linux

  vars_files:
    - sat_repos.yml
    - extra_vars.yml

  tasks:
    - name: Copy manifest over
      ansible.builtin.copy:
        src: manifest.zip
        dest: "{{ satellite_manifest_path }}"
        owner: root
        group: root
        mode: '0644'
      tags:
        - pre_task

    - name: Register repos
      community.general.rhsm_repository:
        name:
          - rhel-9-for-x86_64-baseos-rpms
          - rhel-9-for-x86_64-appstream-rpms
          - satellite-6.16-for-rhel-9-x86_64-rpms
          - satellite-maintenance-6.16-for-rhel-9-x86_64-rpms
        purge: true

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true

    - name: Install chrony
      ansible.builtin.include_role:
        name: oasis_roles.system.chrony
      tags:
        - software

    - name: Install satellite package # noqa: package-latest
      ansible.builtin.dnf:
        name:
          - satellite
          - foreman-installer
        state: latest
        # update_only: true
      tags:
        - pre_task

    - name: Patch Satellite for keyalg
      ansible.posix.patch:
        src: "keyalg.patch"
        basedir: /usr/share/foreman-installer/modules/certs/lib/puppet_x/certs/provider
      notify: restart_satellite

    - name: Patch to convert virt CD to SCSI
      ansible.posix.patch:
        src: q35-image.patch
        dest: /usr/share/gems/gems/fog-libvirt-0.12.2/lib/fog/libvirt/models/compute/server.rb
        backup: true
      notify: restart_satellite

    - name: Set satellite_password
      ansible.builtin.set_fact:
        satellite_password: "{{ satellite_password }}"
      tags:
        - software

    - name: Check if Satellite is installed and running
      ansible.builtin.shell: >-
        satellite-maintain service status --brief | grep 'All services are running'
      ignore_errors: true
      register: satellite_status
      changed_when: satellite_status.rc != 0

    - name: Add self to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        insertafter: EOF
        line: 192.168.100.2   {{ satellite_fqdn }}
        state: present

    - name: Run installer
      ansible.builtin.include_role:
        name: redhat.satellite_operations.installer
      vars:
        satellite_installer_scenario: satellite # noqa: var-naming[no-role-prefix]
        satellite_installer_options:
          - "--foreman-initial-admin-password {{ satellite_password }}"
          - "--enable-foreman-plugin-remote-execution-cockpit"
          - "--enable-foreman-plugin-openscap"
          - "--enable-foreman-proxy-plugin-openscap"
          - "--foreman-proxy-dns-forwarders 192.168.1.1"
          #  - "--foreman-proxy-plugin-openscap-puppet-module true"
        satellite_installer_command: satellite-installer
      when:
        - satellite_status.stdout is defined
        - not 'OK' in satellite_status.stdout
      tags:
        - software

    - name: Run installer again
      ansible.builtin.include_role:
        name: redhat.satellite_operations.installer
      vars:
        satellite_installer_scenario: satellite # noqa: var-naming[no-role-prefix]
        satellite_installer_options:
          - "--foreman-initial-admin-password {{ satellite_password }}"
          - "--enable-foreman-plugin-remote-execution-cockpit"
          - "--enable-foreman-plugin-openscap"
          - "--enable-foreman-proxy-plugin-openscap"
          - "--foreman-proxy-dns-forwarders 192.168.1.1"
          #  - "--foreman-proxy-plugin-openscap-puppet-module true"
        satellite_installer_command: satellite-installer
      when:
        - satellite_status.stdout is defined
        - not 'OK' in satellite_status.stdout
      tags:
        - software

    - name: Import manifest
      ansible.builtin.include_role:
        name: redhat.satellite.manifest
      when:
        - satellite_status.stdout is defined
        - not 'OK' in satellite_status.stdout
      tags:
        - post_software

    # - name: Refresh manifest
    #   redhat.satellite.subscription_manifest:
    #     organization: "{{ satellite_organization }}"
    #     state: refreshed
    #     server_url: "{{ satellite_server_url }}"
    #     username: "{{ satellite_username }}"
    #     password: "{{ satellite_password }}"
    #     validate_certs: false
    #   async: 2000
    #   poll: 60
    #   tags:
    #     - post_software

    - name: Enable repositories
      ansible.builtin.include_role:
        name: redhat.satellite.repositories
      tags:
        - post_software

    - name: Sync repositories
      ansible.builtin.include_role:
        name: redhat.satellite.repositories
      tags:
        - post_software

    - name: Install default scap content
      ansible.builtin.command: hammer scap-content bulk-upload --type default
      register: output
      changed_when: output.rc != 0

    - name: MOTD
      ansible.builtin.copy:
        dest: /etc/motd
        mode: '0644'
        content: |
          #########################################
          ## Login with Password {{ satellite_password }} ##
          #########################################
      tags:
        - post_software

    - name: Create GPG key directory for importing keys
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - /etc/pki/rpm-gpg/import

    - name: Hammer org list
      ansible.builtin.command: >-
        hammer --output json organization list
      environment:
        HOME: /root
      register: hammer_org_list_result
      ignore_errors: true
      changed_when: hammer_org_list_result.rc != 0

    - name: Set the Organization Id from specific org selection via satellite_organization variable and .Id
      ansible.builtin.set_fact:
        sat_org_id: "{{ hammer_org_list_result.stdout | from_json | json_query(my_query) }}"
      vars:
        my_query: "[?Name=='{{ satellite_organization }}'].Id"

    - name: What is the Org Id?
      ansible.builtin.debug:
        msg: "The Org Id selected is: {{ sat_org_id[0] }}"

    - name: Print repository_sets defined
      ansible.builtin.debug:
        msg: "{{ item.name }}"
      throttle: 1
      with_community.general.flattened: "{{ satellite_products }}"
      when: item.repository_sets is defined

    - name: Print repositories defined
      ansible.builtin.debug:
        msg: "{{ item.name }}"
      throttle: 1
      with_community.general.flattened: "{{ satellite_products }}"
      when: item.repositories is defined

    - name: Sync repository_sets defined
      redhat.satellite.repository_sync:
        product: "{{ item.name }}"
        organization: "{{ satellite_organization }}"
        server_url: "{{ satellite_server_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
      throttle: 1
      with_community.general.flattened: "{{ satellite_products }}"
      when: item.repository_sets is defined
      register: repo_sets_sync
      retries: 2
      delay: 15
      until: repo_sets_sync is not failed

    - name: Sync repositories defined
      redhat.satellite.repository_sync:
        product: "{{ item.name }}"
        organization: "{{ satellite_organization }}"
        server_url: "{{ satellite_server_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
      throttle: 1
      with_community.general.flattened: "{{ satellite_products }}"
      when: item.repositories is defined
      register: repo_sync
      retries: 2
      delay: 15
      until: repo_sync is not failed

  handlers:
    - name: Restart Satellite
      listen: restart_satellite
      ansible.builtin.command:
        cmd: /usr/bin/satellite-maintain service restart
      changed_when: false

# Setup Satellite for provisioning
#

- name: Setup satellite for provisioning
  # gather_facts: false
  hosts: satellite
  become: true
  vars_files:
    - extra_vars.yml
    - sat_repos.yml

  tasks:
    - name: Setup DNS, DHCP  and TFTP
      ansible.builtin.include_role:
        name: redhat.satellite_operations.installer
      vars:
        satellite_installer_scenario: satellite # noqa: var-naming[no-role-prefix]
        satellite_installer_options:
          - "--foreman-proxy-dns true"
          - "--foreman-proxy-dns-managed true"
          - "--foreman-proxy-dns-interface eth0"
          - "--foreman-proxy-dns-zone {{ satellite_domain }}"
          - "--foreman-proxy-dns-reverse 100.168.192.in-addr.arpa"
          - "--foreman-proxy-dhcp true"
          - "--foreman-proxy-dhcp-managed true"
          - "--foreman-proxy-dhcp-interface eth0"
          - "--foreman-proxy-dhcp-range '192.168.100.50 192.168.100.150'"
          - "--foreman-proxy-dhcp-gateway {{ satellite_gateway }}"
          - "--foreman-proxy-dhcp-nameservers 192.168.100.2"
          - "--foreman-proxy-tftp true"
          - "--foreman-proxy-tftp-managed true"
          - "--foreman-proxy-tftp-servername 192.168.100.2"
      # tags:
      #   - never

    # - name: Point DNS to self
    #   ansible.builtin.include_role:
    #     name: linux-system-roles.network
    #   vars:
    #     network_provider: nm
    #     network_allow_restart: true
    #     network_connections:
    #       - name: eth0
    #         type: ethernet
    #         autoconnect: true
    #         ip:
    #           gateway4: "192.168.100.1"
    #           address:
    #             - "192.168.100.2/24"
    #           dns:
    #             - "192.168.100.2"
    #           dns_search:
    #             - "{{ satellite_domain }}"
    - name: Point DNS to self
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        search_string: 192.168.1.1
        line: nameserver 192.168.100.2

    - name: Setup domain
      redhat.satellite.domain:
        name: "{{ satellite_domain }}"
        description: "{{ satellite_domain }}"
        dns_proxy: "{{ satellite_fqdn }}"
        server_url: "{{ satellite_server_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"

    - name: Setup subnet
      ansible.builtin.include_role:
        name: redhat.satellite.subnets
      vars:
        satellite_subnets: # noqa: var-naming[no-role-prefix]
          - name: "{{ satellite_domain }}"
            network: "192.168.100.0"
            mask: "255.255.255.0"
            gateway: "{{ satellite_gateway }}"
            dns_primary: "192.168.100.2"
            ipam: "DHCP"
            dns_proxy: "satellite.{{ satellite_domain }}"
            tftp_proxy: "satellite.{{ satellite_domain }}"
            dhcp_proxy: "satellite.{{ satellite_domain }}"
            discovery_proxy: "satellite.{{ satellite_domain }}"
            remote_execution_proxies: satellite.{{ satellite_domain }}"
            domains:
              - "{{ satellite_domain }}"

